<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Календарь - Счастливы на селе</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { background-color: #F7F5F0; color: #2C2C2A; font-family: 'Plus Jakarta Sans', sans-serif; } ::-webkit-scrollbar { display: none; }</style>
</head>
<body class="min-h-screen flex flex-col max-w-md mx-auto bg-white shadow-2xl relative border-x border-[#EFECE6]">
    <header class="bg-white/95 backdrop-blur-xl border-b border-[#EFECE6] sticky top-0 z-50 px-5 pt-4 pb-3 flex justify-between items-center">
        <div>
            <span class="text-[9px] uppercase tracking-widest text-[#5C5346] font-semibold">важные даты</span>
            <h1 class="text-base font-bold text-[#4A5320]">календарь</h1>
        </div>
    </header>
    
    <!-- Добавлен overflow-y-auto для вертикальной прокрутки всего календаря -->
    <main class="flex-1 overflow-y-auto p-4 pb-24 space-y-4">
        <div class="bg-white p-4 rounded-3xl shadow-sm border border-[#EFECE6] space-y-3">
            <div class="flex justify-between items-center">
                <h2 class="font-bold text-sm text-[#4A5320]">📅 Агро-календарь</h2>
                <div class="flex gap-1 bg-[#F7F5F0] p-1 rounded-xl border border-[#EFECE6]">
                    <button onclick="setYear(2026)" id="y-2026" class="px-2.5 py-1 text-xs rounded-lg font-semibold bg-white text-[#4A5320] shadow-sm">2026</button>
                    <button onclick="setYear(2027)" id="y-2027" class="px-2.5 py-1 text-xs rounded-lg text-stone-500">2027</button>
                </div>
            </div>
            
            <!-- ИСПРАВЛЕНИЕ: flex-wrap вместо скролла. Все месяцы будут на экране -->
            <div class="flex flex-wrap gap-1.5 justify-center pb-2 text-xs" id="month-buttons">
                <!-- Кнопки месяцев сгенерируются скриптом -->
            </div>

            <div id="calendar-grid-container" class="bg-[#F7F5F0] p-3 rounded-2xl border border-[#EFECE6]"></div>
            
            <div class="p-3 rounded-2xl bg-[#FAF8F5] border border-[#E2DDD5] text-xs space-y-1">
                <span class="font-bold text-[#4A5320]" id="info-date-title">Выберите дату в сетке</span>
                <p class="text-stone-600" id="info-date-desc">Здесь появится праздник, агро-дата или мягкое напоминание о том, как прекрасна женщина.</p>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/95 backdrop-blur-xl border-t border-[#EFECE6] py-2 px-3 flex justify-around items-center z-50 text-[10px]">
        <a href="index.html" class="flex flex-col items-center text-stone-400"><span>✨</span><span>Лента</span></a>
        <a href="blog.html" class="flex flex-col items-center text-stone-400"><span>📖</span><span>Блог</span></a>
        <a href="calendar.html" class="flex flex-col items-center text-[#4A5320] font-semibold"><span>📅</span><span>Календарь</span></a>
        <a href="psychology.html" class="flex flex-col items-center text-stone-400"><span>🤍</span><span>Психология</span></a>
        <a href="recipes.html" class="flex flex-col items-center text-stone-400"><span>🍲</span><span>Рецепты</span></a>
    </nav>
    <script>
        const affirmations = [
            "Твоя сила — в твоем внутреннем спокойствии и любви к родной земле.", 
            "Каждый твой день наполнен созиданием и красотой.", 
            "Ты — душа и уют своего дома, вдохновляющая всех вокруг.",
            "Твоя улыбка светит ярче утреннего солнца."
        ];
        const specialDates = { 
            "2026-03-08": "💐 Международный женский день", 
            "2026-10-15": "👩‍🌾 Международный день сельских женщин", 
            "2026-09-25": "🌾 Праздник урожая",
            "2027-03-08": "💐 Международный женский день", 
            "2027-10-15": "👩‍🌾 Международный день сельских женщин",
            "2027-09-25": "🌾 Праздник урожая"
        };
        let currentYear = 2026, currentMonth = 2; // Март
        const monthNamesShort = ["Янв", "Фев", "Мар", "Апр", "Май", "Июн", "Июл", "Авг", "Сен", "Окт", "Ноя", "Дек"];
        const monthNamesFull = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];

        function renderMonthButtons() {
            let container = document.getElementById('month-buttons');
            let html = "";
            for (let i = 0; i < 12; i++) {
                let bgClass = (i === currentMonth) ? "bg-[#4A5320] text-white font-medium shadow-sm" : "bg-[#F7F5F0] text-stone-600";
                html += `<button onclick="setMonth(${i})" class="px-3 py-1.5 rounded-lg transition ${bgClass}">${monthNamesShort[i]}</button>`;
            }
            container.innerHTML = html;
        }

        function setYear(y) { 
            currentYear = y; 
            document.getElementById('y-2026').className = y === 2026 ? "px-2.5 py-1 text-xs rounded-lg font-semibold bg-white text-[#4A5320] shadow-sm transition" : "px-2.5 py-1 text-xs rounded-lg text-stone-500 transition";
            document.getElementById('y-2027').className = y === 2027 ? "px-2.5 py-1 text-xs rounded-lg font-semibold bg-white text-[#4A5320] shadow-sm transition" : "px-2.5 py-1 text-xs rounded-lg text-stone-500 transition";
            renderCalendar(); 
        }

        function setMonth(m) { 
            currentMonth = m; 
            renderMonthButtons();
            renderCalendar(); 
        }

        function renderCalendar() {
            let container = document.getElementById('calendar-grid-container');
            let html = `<div class="text-center font-bold text-xs mb-3 text-[#4A5320]">${monthNamesFull[currentMonth]} ${currentYear}</div>`;
            html += `<div class="grid grid-cols-7 gap-1 text-center text-[10px] font-semibold text-stone-400 mb-2"><div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div></div>`;
            html += `<div class="grid grid-cols-7 gap-1 text-center text-xs">`;
            
            let firstDay = new Date(currentYear, currentMonth, 1).getDay();
            let daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            let startDay = firstDay === 0 ? 6 : firstDay - 1;
            
            for (let i = 0; i < startDay; i++) { html += `<div></div>`; }
            for (let d = 1; d <= daysInMonth; d++) {
                let mStr = String(currentMonth + 1).padStart(2, '0'); 
                let dStr = String(d).padStart(2, '0');
                let dateKey = `${currentYear}-${mStr}-${dStr}`; 
                let holiday = specialDates[dateKey];
                let bg = holiday ? "bg-[#4A5320] text-white font-bold shadow-sm" : "bg-white text-stone-700 hover:bg-[#EFECE6]";
                html += `<div onclick="selectDate('${dateKey}', '${holiday || ''}')" class="h-8 rounded-lg flex items-center justify-center text-[11px] cursor-pointer transition ${bg}">${d}</div>`;
            }
            container.innerHTML = html + `</div>`;
        }

        function selectDate(dateStr, holiday) {
            document.getElementById('info-date-title').innerText = dateStr;
            document.getElementById('info-date-desc').innerText = holiday || `✨ ${affirmations[Math.floor(Math.random() * affirmations.length)]}`;
        }
        
        renderMonthButtons();
        renderCalendar();
    </script>
</body>
</html>
