<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Избранное</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @font-face { font-family: 'Gramatika'; src: local('Arial-BoldMT'), sans-serif; }
        @font-face { font-family: 'Kommuna Demo'; src: local('Georgia'), serif; }
        body { background-color: #F7F5F0; color: #2C2C2A; font-family: 'Kommuna Demo', serif; }
        h1, h2, h3, .font-brand { font-family: 'Gramatika', sans-serif; }
        .bg-polyana { background-color: #DDE59B; } .bg-luga { background-color: #7CBA74; } .bg-les { background-color: #3A7843; } .bg-schastye { background-color: #E37A99; }
        .text-les { color: #3A7843; } .text-schastye { color: #E37A99; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col max-w-md mx-auto bg-white shadow-2xl relative border-x border-[#EFECE6]">
    <header class="bg-white/95 backdrop-blur-xl border-b border-[#EFECE6] sticky top-0 z-50 px-5 pt-4 pb-3 flex items-center gap-3">
        <a href="index.html" class="w-8 h-8 rounded-full bg-[#F7F5F0] flex items-center justify-center text-xs font-bold text-stone-600">←</a>
        <div>
            <span class="text-[9px] uppercase tracking-widest text-[#5C5346] font-semibold">сохраненное</span>
            <h1 class="text-base font-bold text-les font-brand">избранное</h1>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto pb-16" id="fav-container"></main>

    <script>
        function renderFavorites() {
            const container = document.getElementById('fav-container');
            const favorites = JSON.parse(localStorage.getItem('favPosts')) || [];

            if (favorites.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full pt-20 text-center px-6">
                        <span class="text-4xl mb-3">🤍</span>
                        <h2 class="font-brand font-bold text-stone-800">Пока ничего нет</h2>
                        <p class="text-xs text-stone-500 mt-2">Нажимайте на сердечко в ленте, чтобы сохранять сюда любимые посты и эстетику.</p>
                        <a href="index.html" class="mt-6 px-5 py-2 bg-polyana text-les font-bold rounded-xl text-xs">Вернуться в ленту</a>
                    </div>`;
                return;
            }

            container.innerHTML = favorites.map(post => {
                return `
                <article class="bg-white border-b border-[#EFECE6] pb-4" id="fav-art-${post.id}">
                    <div class="relative">
                        <img src="${post.img}" class="w-full h-[40vh] object-cover" alt="Фото">
                        <span class="absolute top-4 left-4 px-3 py-1 ${post.tagColor} text-white rounded-full text-[10px] shadow-sm font-brand">${post.tag}</span>
                    </div>
                    
                    <div class="px-4 pt-3 pb-1 flex gap-4 items-center">
                        <button onclick="removeLike('${post.id}')" class="text-2xl hover:scale-110 transition-transform">❤️</button>
                    </div>

                    <div class="px-5 space-y-1">
                        <h3 class="font-bold text-base text-stone-800 font-brand">${post.title}</h3>
                        <p class="text-xs text-stone-600 leading-relaxed line-clamp-2">${post.text}</p>
                    </div>
                </article>`;
            }).join('');
        }

        function removeLike(id) {
            let favorites = JSON.parse(localStorage.getItem('favPosts')) || [];
            favorites = favorites.filter(fav => fav.id !== id);
            localStorage.setItem('favPosts', JSON.stringify(favorites));
            renderFavorites();
        }

        renderFavorites();
    </script>
</body>
</html>
